<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Example</title>
		<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css"
		/>
		<link href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css" rel="stylesheet" />
		<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
		<link href="./dist/maplibre-gl-legend.css" rel="stylesheet" />
		<style>
			body {
				margin: 0;
				padding: 0;
			}
			#map {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 100%;
				z-index: 10;
			}
		</style>
	</head>
	<body>
		<a
			class="github-fork-ribbon left-top"
			href="https://github.com/watergis/maplibre-gl-legend"
			data-ribbon="Fork me on GitHub"
			title="Fork me on GitHub"
			>Fork me on GitHub</a
		>
		<div id="map"></div>
		<script type="module">
			// maplibre-gl v6 is distributed as ES modules only, so this example loads both maplibre-gl and the plugin as ES modules
			import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs';
			import { MaplibreLegendControl } from './dist/maplibre-gl-legend.es.js';

			const protocol = new pmtiles.Protocol();
			maplibregl.addProtocol('pmtiles', protocol.tile);

			const map = new maplibregl.Map({
				container: 'map',
				style: 'https://narwassco.github.io/mapbox-stylefiles/unvt/style.json',
				center: [35.87063, -1.08551],
				zoom: 12,
				hash: true
			});
			map.addControl(new maplibregl.NavigationControl({}), 'top-right');

			map.on('load', function () {
				const targets = {
					pipeline: 'Pipeline',
					pipeline_annotation: 'Pipeline Label',
					meter: 'Water Meter',
					'flow meter': 'Flow Meter',
					valve: 'Valve',
					firehydrant: 'Fire Hydrant',
					washout: 'Washout',
					tank: 'Tank',
					tank_annotation: 'Tank Label',
					wtp: 'WTP',
					wtp_annotation: 'WTP Label',
					intake: 'Intake',
					intake_annotation: 'Intake Label',
					parcels: 'Parcels',
					parcels_annotation: 'Parcels Label',
					village: 'Village',
					village_annotation: 'Village Label',
					dma: 'DMA',
					'dma-annotation': 'DMA Label',
					'contour-line': 'Countour',
					'contour-label': 'Contour Label',
					hillshade: 'Hillshade'
				};
				map.addControl(
					new MaplibreLegendControl(targets, {
						showDefault: true,
						showCheckbox: true,
						onlyRendered: true,
						reverseOrder: true
					}),
					'bottom-left'
				);
			});
		</script>
	</body>
</html>
